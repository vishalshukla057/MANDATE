services:
  - type: web
    name: collections-copilot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: dev
      - key: PAYPAL_MODE
        value: live
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: copilot-db
          property: connectionString
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MERCHANT_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-3-5-sonnet-20241022

databases:
  - name: copilot-db
    databaseName: copilot
    user: copilot_user
